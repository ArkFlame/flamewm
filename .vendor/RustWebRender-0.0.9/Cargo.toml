[workspace]
members = [
    "crates/rustwebrender-core",
    "crates/rustwebrender-compiler",
    "crates/rustwebrender-x11",
]
resolver = "2"

[workspace.package]
version = "0.0.9"
edition = "2021"
license = "MIT"
rust-version = "1.70"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.release.package.rustwebrender-compiler]
opt-level = 2
