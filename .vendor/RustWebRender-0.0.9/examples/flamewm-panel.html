<!doctype html>
<html>
<head>
<style>
:root { --accent: #e53935; --panel: #f4f4f5; --text: #18181b; }
* { box-sizing: border-box; }
body { display:flex; align-items:center; gap:4px; padding:4px 8px; background:var(--panel); color:var(--text); }
button { height:36px; padding:6px 12px; background:transparent; color:var(--text); border:0px solid transparent; border-radius:6px; }
button:hover { background:#e4e4e7; }
.start { width:40px; padding:0px; background:var(--accent); color:white; font-weight:bold; }
.spacer { flex-grow:1; }
.clock { width:70px; }
</style>
</head>
<body>
  <button class="start" data-action="start.toggle">F</button>
  <button data-action="task.terminal">Terminal</button>
  <button data-action="task.files">Files</button>
  <div class="spacer"></div>
  <button data-action="network.open">WiFi</button>
  <button id="clock" class="clock" data-action="clock.open">19:18</button>
</body>
</html>
