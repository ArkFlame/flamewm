<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>RustWebRender FlameWM shell experiment</title>
  <link rel="stylesheet" href="flamewm-shell.css">
</head>
<body>
  <section id="start-menu" class="start-menu">
    <div class="brand-row">
      <div class="brand-mark"></div>
      <span class="brand-name">FlameWM</span>
    </div>
    <div class="search-box">Search applications</div>
    <div class="menu-list">
      <button data-action="app.files">Files</button>
      <button data-action="app.terminal">Terminal</button>
      <button data-action="app.settings">FlameWM Settings</button>
      <button data-action="app.browser">Web Browser</button>
    </div>
    <div class="menu-footer">
      <span>User</span>
      <button class="power" data-action="session.power">Power</button>
    </div>
  </section>

  <footer class="panel">
    <button class="start" data-action="start.toggle">F</button>
    <button class="task active" data-action="task.terminal">Terminal</button>
    <button class="task" data-action="task.files">Files</button>
    <div class="spacer"></div>
    <button class="tray" data-action="network.open">WiFi</button>
    <button class="tray" data-action="volume.open">Vol</button>
    <button class="clock" data-action="clock.open"><span id="clock">19:18</span></button>
  </footer>
</body>
</html>
