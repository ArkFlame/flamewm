[package]
name = "rustwebrender-compiler"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Build-time HTML/CSS compiler for RustWebRender"

[dependencies]
rustwebrender-core = { path = "../rustwebrender-core" }

[lib]
path = "src/lib.rs"

[[bin]]
name = "rwr-compile"
path = "src/bin/rwr-compile.rs"

[[bin]]
name = "rwr-inspect"
path = "src/bin/rwr-inspect.rs"
