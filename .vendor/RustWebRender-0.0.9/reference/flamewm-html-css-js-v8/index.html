<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>FlameWM Desktop Prototype v8</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="desktop" aria-label="FlameWM desktop">
    <div id="wallpaper" aria-hidden="true"></div>
    <img id="flamewm-watermark" src="assets/flamewm.png" alt="" aria-hidden="true" draggable="false" />
    <section id="desktop-grid" aria-label="Desktop files"></section>
    <div id="desktop-selection-rectangle" class="desktop-selection-rectangle hidden" aria-hidden="true"></div>
    <section id="sticky-note-layer" aria-label="Sticky notes"></section>
    <section id="window-layer" aria-label="Windows"></section>
    <div id="snap-preview" aria-hidden="true"></div>
    <div id="taskbar-dock-preview" aria-hidden="true"></div>

    <section id="start-menu" class="panel-popover start-menu hidden" aria-label="Application launcher"></section>
    <section id="audio-popup" class="panel-popover tray-popup hidden" aria-label="Audio"></section>
    <section id="media-popup" class="panel-popover tray-popup hidden" aria-label="Media controls"></section>
    <section id="wifi-popup" class="panel-popover tray-popup hidden" aria-label="Wi-Fi"></section>
    <section id="clock-popup" class="panel-popover clock-popup hidden" aria-label="Calendar"></section>
    <section id="desktop-menu" class="context-menu hidden" aria-label="Desktop menu"></section>
    <section id="workspace-menu" class="context-menu hidden" aria-label="Workspace menu"></section>
    <section id="task-menu" class="context-menu hidden" aria-label="Task menu"></section>
    <section id="entry-menu" class="context-menu hidden" aria-label="Desktop entry menu"></section>
    <section id="taskbar-menu" class="context-menu hidden" aria-label="Taskbar menu"></section>
    <section id="sticky-menu" class="context-menu hidden" aria-label="Sticky note menu"></section>

    <footer id="taskbar" aria-label="Taskbar">
      <button id="start-button" class="panel-button start-button" aria-label="Start menu" title="FlameWM Start"></button>
      <div id="task-entries" class="taskbar-group task-entries" aria-label="Applications and windows"></div>
      <div class="taskbar-spacer"></div>
      <div id="workspace-pager" class="workspace-pager" aria-label="Virtual desktops"></div>
      <button id="media-button" class="panel-button tray-button" aria-label="Media" title="Media"></button>
      <button id="audio-button" class="panel-button tray-button" aria-label="Volume" title="Volume"></button>
      <button id="wifi-button" class="panel-button tray-button" aria-label="Wi-Fi" title="Wi-Fi"></button>
      <button id="clock-button" class="clock-button" aria-label="Date and time"></button>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
