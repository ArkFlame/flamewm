<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>CreamUI Showcase</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #211f20;
        color: #f4eff1;
        font-family: system-ui, sans-serif;
      }
      /* winit sets the canvas's inline CSS size itself (from the app's
         requested window size); `!important` here keeps this demo's canvas
         acting like the whole browser window regardless of that, so click,
         keyboard and scroll all land on the real content instead of empty
         page background around a smaller box. */
      canvas {
        display: block;
        width: 100vw !important;
        height: 100vh !important;
        outline: none;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <script type="module">
      import init from "./pkg/creamui_showcase_web.js";
      init();
    </script>
  </body>
</html>
