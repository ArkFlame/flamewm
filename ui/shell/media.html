<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>FlameWM media</title>
  <link rel="stylesheet" href="flamewm.css">
</head>
<body class="popup-body">
  <section id="media-popup" class="tray-popup media-popup" data-action="popup.surface">
    <div class="popup-title">Now Playing</div>
    <div class="media-now">
      <div class="album-art"></div>
      <div class="media-copy">
        <div id="media-title" class="media-title">&#8203;</div>
        <div id="media-artist" class="popup-subtitle">&#8203;</div>
      </div>
    </div>
    <div class="media-controls">
      <button class="media-control" data-action="media.previous"><img class="symbolic-icon" src="assets/breeze/media-skip-backward.svg"></button>
      <button class="media-control" data-action="media.playpause"><img class="symbolic-icon" id="media-play-icon" src="assets/breeze/media-playback-start.svg"><img class="symbolic-icon" id="media-pause-icon" src="assets/breeze/media-playback-pause.svg"></button>
      <button class="media-control" data-action="media.next"><img class="symbolic-icon" src="assets/breeze/media-skip-forward.svg"></button>
    </div>
  </section>
</body>
</html>
