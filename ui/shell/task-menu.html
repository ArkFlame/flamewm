<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>FlameWM task menu</title>
  <link rel="stylesheet" href="flamewm.css">
</head>
<body class="popup-body">
  <section id="task-menu" class="context-menu compact-context" data-action="task.menu.surface">
    <button id="context-task-activate" class="menu-row" data-action="task.menu.activate"><div>Activate</div></button>
    <button id="context-task-close" class="menu-row" data-action="task.menu.close"><div>Close</div></button>
    <button id="context-task-unpin" class="menu-row" data-action="task.menu.unpin"><div>Unpin</div></button>
    <button id="context-workspace-activate" class="menu-row" data-action="workspace.menu.activate"><div>Activate</div></button>
    <button id="context-workspace-insert-after" class="menu-row" data-action="workspace.menu.insert-after"><div>Insert workspace after</div></button>
    <button id="context-workspace-remove" class="menu-row" data-action="workspace.menu.remove"><div>Remove workspace</div></button>
  </section>
</body>
</html>
