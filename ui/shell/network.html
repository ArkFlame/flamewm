<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>FlameWM network</title>
  <link rel="stylesheet" href="flamewm.css">
</head>
<body class="popup-body">
  <section id="wifi-popup" class="tray-popup wifi-popup" data-action="popup.surface">
    <div class="popup-title">Networks</div><div class="network-search"><div id="network-filter-label">Filter</div></div>
    <div class="popup-subtitle">Connected to <span id="wifi-connected-name">&#8203;</span></div>
    <div class="network-actions"><button id="network-wifi-toggle" data-action="network.wifi.toggle">Wi-Fi</button><button id="network-scan" data-action="network.scan">Scan</button><button id="network-disconnect" data-action="network.disconnect">Disconnect</button></div>
    <div class="popup-subtitle">Connected</div><div id="network-connected" class="network-slots"></div><div class="popup-subtitle">Available</div><div id="network-slots" class="network-slots">
      <button id="network-slot-1" class="wifi-row" data-action="network.connect.1"><img src="assets/breeze/network-wireless.svg"><div><div id="network-slot-1-name">&#8203;</div><div id="network-slot-1-status" class="wifi-status">&#8203;</div></div></button>
      <button id="network-slot-2" class="wifi-row" data-action="network.connect.2"><img src="assets/breeze/network-wireless.svg"><div><div id="network-slot-2-name">&#8203;</div><div id="network-slot-2-status" class="wifi-status">&#8203;</div></div></button>
      <button id="network-slot-3" class="wifi-row" data-action="network.connect.3"><img src="assets/breeze/network-wireless.svg"><div><div id="network-slot-3-name">&#8203;</div><div id="network-slot-3-status" class="wifi-status">&#8203;</div></div></button>
    </div>
    <div id="network-secret" class="network-secret"><div id="network-secret-value" class="network-secret-value">&#8203;</div><button data-action="network.secret.submit">Connect</button><button data-action="network.secret.cancel">Cancel</button></div>
  </section>
</body>
</html>
