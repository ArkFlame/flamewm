<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>FlameWM Start submenu</title>
  <link rel="stylesheet" href="flamewm.css">
</head>
  <body class="popup-body">
  <section id="start-submenu" class="start-submenu" data-action="start.menu.surface">
    <div id="start-list" class="start-list"><div id="start-applications" class="start-group">
      <button id="start-app-slot-1" class="start-app" data-action="start.app.1"><img id="start-app-slot-1-icon" src="assets/branding/flamewm-start.svg"><div id="start-app-slot-1-label">&#8203;</div></button>
      <button id="start-app-slot-2" class="start-app" data-action="start.app.2"><img id="start-app-slot-2-icon" src="assets/branding/flamewm-start.svg"><div id="start-app-slot-2-label">&#8203;</div></button>
      <button id="start-app-slot-3" class="start-app" data-action="start.app.3"><img id="start-app-slot-3-icon" src="assets/branding/flamewm-start.svg"><div id="start-app-slot-3-label">&#8203;</div></button>
      <button id="start-app-slot-4" class="start-app" data-action="start.app.4"><img id="start-app-slot-4-icon" src="assets/branding/flamewm-start.svg"><div id="start-app-slot-4-label">&#8203;</div></button>
      <button id="start-app-slot-5" class="start-app" data-action="start.app.5"><img id="start-app-slot-5-icon" src="assets/branding/flamewm-start.svg"><div id="start-app-slot-5-label">&#8203;</div></button>
      <button id="start-app-slot-6" class="start-app" data-action="start.app.6"><img id="start-app-slot-6-icon" src="assets/branding/flamewm-start.svg"><div id="start-app-slot-6-label">&#8203;</div></button>
      <button id="start-app-slot-7" class="start-app" data-action="start.app.7"><img id="start-app-slot-7-icon" src="assets/branding/flamewm-start.svg"><div id="start-app-slot-7-label">&#8203;</div></button>
      <button id="start-app-slot-8" class="start-app" data-action="start.app.8"><img id="start-app-slot-8-icon" src="assets/branding/flamewm-start.svg"><div id="start-app-slot-8-label">&#8203;</div></button>
    </div></div>
    <div id="start-group-power" class="start-group">
      <button id="start-session-lock" class="start-app" data-action="session.lock"><img class="symbolic-icon" src="assets/breeze/system-lock-screen.svg"><div>Lock Screen</div></button>
      <button id="start-session-logout" class="start-app" data-action="session.logout"><img class="symbolic-icon" src="assets/breeze/system-log-out.svg"><div>Log Out</div></button>
      <button id="start-session-suspend" class="start-app" data-action="session.suspend"><img class="symbolic-icon" src="assets/breeze/system-shutdown.svg"><div>Suspend</div></button>
      <button id="start-session-reboot" class="start-app" data-action="session.reboot"><img class="symbolic-icon" src="assets/breeze/system-reboot.svg"><div>Restart</div></button>
      <button id="start-session-shutdown" class="start-app" data-action="session.shutdown"><img class="symbolic-icon" src="assets/breeze/system-shutdown.svg"><div>Shut Down</div></button>
    </div>
  </section>
</body>
</html>
