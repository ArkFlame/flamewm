<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>FlameWM Start</title>
  <link rel="stylesheet" href="flamewm.css">
</head>
<body class="popup-body">
  <section id="start-menu" class="start-menu" data-action="start.menu.surface">
    <div id="start-categories" class="start-categories">
      <button id="start-category-development" class="start-category" data-action="start.category.development"><img src="assets/breeze/applications-development.svg"><div>Development</div><img class="symbolic-icon chevron" src="assets/breeze/go-next.svg"></button>
      <button id="start-category-games" class="start-category" data-action="start.category.games"><img src="assets/breeze/applications-games.svg"><div>Games</div><img class="symbolic-icon chevron" src="assets/breeze/go-next.svg"></button>
      <button id="start-category-graphics" class="start-category" data-action="start.category.graphics"><img src="assets/breeze/applications-graphics.svg"><div>Graphics</div><img class="symbolic-icon chevron" src="assets/breeze/go-next.svg"></button>
      <button id="start-category-internet" class="start-category" data-action="start.category.internet"><img src="assets/breeze/applications-internet.svg"><div>Internet</div><img class="symbolic-icon chevron" src="assets/breeze/go-next.svg"></button>
      <button id="start-category-multimedia" class="start-category" data-action="start.category.multimedia"><img src="assets/breeze/applications-multimedia.svg"><div>Multimedia</div><img class="symbolic-icon chevron" src="assets/breeze/go-next.svg"></button>
      <button id="start-category-system" class="start-category" data-action="start.category.system"><img src="assets/breeze/applications-system.svg"><div>System</div><img class="symbolic-icon chevron" src="assets/breeze/go-next.svg"></button>
      <button id="start-category-utilities" class="start-category" data-action="start.category.utilities"><img src="assets/breeze/applications-utilities.svg"><div>Utilities</div><img class="symbolic-icon chevron" src="assets/breeze/go-next.svg"></button>
      <button id="start-category-power" class="start-category" data-action="start.category.power"><img class="symbolic-icon" src="assets/breeze/system-shutdown.svg"><div>Power / Session</div><img class="symbolic-icon chevron" src="assets/breeze/go-next.svg"></button>
    </div>
    <button id="start-search-field" class="start-search" data-action="start.search"><div id="start-search-box" class="start-search-field"><img class="symbolic-icon" src="assets/breeze/edit-find.svg"><div id="start-search-label">Search applications</div></div></button>
  </section>
</body>
</html>
